name: soc-kafka-ha-test
x-broker: &broker
  image: confluentinc/cp-kafka:7.6.1
  mem_limit: 1g
  cpus: 1.5
  healthcheck:
    test: [CMD-SHELL, 'kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1']
    interval: 30s
    timeout: 15s
    retries: 10
    start_period: 30s
  environment: &broker-env
    CLUSTER_ID: Y3ekl92ZsHbRqMRGs52w3w
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093,2@broker-2:9093,3@broker-3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:19092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 6
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: '-Xms256m -Xmx256m'
    KAFKA_LOG_RETENTION_HOURS: 1
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
services:
  broker-1:
    <<: *broker
    hostname: broker-1
    ports: ['127.0.0.1:29092:19092']
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:9092,HOST://127.0.0.1:29092
  broker-2:
    <<: *broker
    hostname: broker-2
    ports: ['127.0.0.1:29093:19092']
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:9092,HOST://127.0.0.1:29093
  broker-3:
    <<: *broker
    hostname: broker-3
    ports: ['127.0.0.1:29094:19092']
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:9092,HOST://127.0.0.1:29094
  mongo:
    image: mongo:8.0
    mem_limit: 768m
    cpus: 1.5
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25', '--bind_ip_all']
    ports: ['127.0.0.1:37017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1})']
      interval: 5s
      timeout: 5s
      retries: 20
